name: peach_pay
description: A closed-loop digital wallet app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State and Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  
  # Supabase & Auth
  supabase_flutter: ^2.4.1
  google_sign_in: ^6.2.1
  
  # Security & Storage
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  
  # QR Code & Scanning
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  
  # Firebase & Notifications
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.15
  flutter_local_notifications: ^17.0.0
  
  # UI & Utils
  fl_chart: ^0.66.0
  share_plus: ^7.2.1
  intl: ^0.19.0
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
