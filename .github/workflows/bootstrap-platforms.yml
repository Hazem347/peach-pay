name: Bootstrap Platforms

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Read project name
        id: read_name
        run: |
          PROJECT_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "project_name=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Create Flutter Platforms
        run: |
          flutter create . --project-name ${{ env.project_name }} --org com.nexo --platforms=android,ios

      - name: Restore lib/ and pubspec.yaml if changed
        run: |
          git checkout -- lib/ pubspec.yaml || true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Commit generated folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/ ios/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bootstrap android and ios platforms"
          git push origin main
