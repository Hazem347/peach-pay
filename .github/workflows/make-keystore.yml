name: Make Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          # Generate strong password
          PASSWORD=$(openssl rand -base64 24)
          ALIAS="peachpay"
          
          # Run keytool to generate the keystore
          keytool -genkey -v \
            -keystore upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias $ALIAS \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Peach Pay, OU=Mobile, O=Peach Pay, L=Unknown, S=Unknown, C=US"
          
          # Print ONLY fingerprints
          echo "Keystore generated successfully. Fingerprints:"
          keytool -list -v -keystore upload-keystore.jks -storepass "$PASSWORD" | grep -E "SHA1:|SHA256:"
          
          # Write passwords to info file for artifact
          echo "Alias: $ALIAS" > keystore-info.txt
          echo "Store Password: $PASSWORD" >> keystore-info.txt
          echo "Key Password: $PASSWORD" >> keystore-info.txt

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-artifacts
          path: |
            upload-keystore.jks
            keystore-info.txt
          retention-days: 1
